<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Minerr</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 14px; background: var(--bg); color: var(--text);
    font: 14px/1.5 "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 12px; }
  h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  header a { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  section { padding: 14px 16px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  h2 { margin: 0 0 10px; font-size: 15px; line-height: 1.3; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: 8px; background: var(--raised); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .sources button { padding: 6px 4px; border: 0; border-radius: 6px; background: none; color: var(--muted); font-size: 13px; }
  .sources button:hover:not(:disabled) { color: var(--text); }
  .sources button:disabled { cursor: default; opacity: .5; }
  .sources button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 700; opacity: 1;
    box-shadow: 0 0 0 1px var(--line), 0 1px 3px rgba(0, 0, 0, .12); }
  .generate { width: 100%; margin-top: 12px; padding: 8px 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .generate:hover:not(:disabled) { filter: brightness(1.08); }
  .generate:disabled { cursor: progress; opacity: .65; }
  progress { display: block; width: 100%; height: 6px; margin-top: 10px; accent-color: var(--accent); }
  #job { margin-top: 8px; font-size: 13px; }
  #job:empty { display: none; }
  .ok { color: var(--ok); font-weight: 600; }
  .error { color: var(--error); font-weight: 600; }
  #server { display: flex; gap: 8px; margin: 12px 2px 0; font-size: 12px; color: var(--muted); }
  #server::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
  #server.ok::before { background: var(--ok); }
  #server.error::before { background: var(--error); }
  #server.ok, #server.error { font-weight: 400; color: var(--muted); }
  code { font: 12px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px;
    padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer; }
  .toggle strong { display: block; font-size: 14px; line-height: 1.3; }
  mark { padding: 0 2px; border-radius: 2px; background: rgba(250, 204, 21, 0.3); color: inherit; }
  .toggle input { appearance: none; position: relative; flex: none; width: 34px; height: 20px; margin: 0; border-radius: 10px;
    background: var(--line); cursor: pointer; }
  .toggle input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  .toggle input:checked { background: var(--accent); }
  .toggle input:checked::before { transform: translateX(14px); }
  .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .player { width: 100%; margin-top: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--card); font-weight: 700; text-align: left; }
  .player:hover { border-color: var(--muted); }
  .player span { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  #score-section { margin-bottom: 10px; }
  .score { display: flex; align-items: baseline; gap: 10px; }
  .score strong { font-size: 28px; line-height: 1.1; }
  .score span { font-weight: 700; }
  .counts { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; }
  h3 { margin: 12px 0 4px; font-size: 13px; }
  #sentences { max-height: 168px; margin: 0; padding: 0; overflow: auto; list-style: none; }
  #sentences button { width: 100%; padding: 4px 6px; border: 0; border-radius: 6px; background: none; text-align: left; font-size: 13px; }
  #sentences button:hover { background: var(--raised); }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .links .player { margin-top: 0; }
</style>
<header>
  <h1>Minerr</h1>
  <a href="options.html" id="options">Options</a>
</header>
<label class="toggle">
  <span><strong>Minerr on</strong><span class="muted">Turns the underlines and the popup on or off in all tabs. Alt+Shift+M does the same.</span></span>
  <input type="checkbox" role="switch" id="enabled">
</label>
<label class="toggle">
  <span><strong>Highlight i+1 sentences</strong><span class="muted">A sentence with one unknown word gets a <mark>soft highlight</mark>.</span></span>
  <input type="checkbox" role="switch" id="iplusone">
</label>
<label class="toggle" id="site-toggle" hidden>
  <span><strong>Minerr on this site</strong><span class="muted" id="site-name"></span></span>
  <input type="checkbox" role="switch" id="site">
</label>
<section aria-labelledby="score-title" id="score-section">
  <h2 id="score-title">Comprehension</h2>
  <p id="score-empty" class="muted">Reading this tab…</p>
  <div id="score" hidden>
    <p class="score"><strong id="score-percent"></strong><span id="score-label"></span></p>
    <ul id="score-counts" class="counts" aria-label="Different words by status"></ul>
    <p id="score-basis" class="muted"></p>
    <h3 id="sentences-title"></h3>
    <ol id="sentences" aria-labelledby="sentences-title"></ol>
  </div>
</section>
<section aria-labelledby="subs-title">
  <h2 id="subs-title">Subtitles</h2>
  <p id="elsewhere" class="muted" hidden>Subtitles work on YouTube watch pages. Open a video, then open this menu again.</p>
  <button class="player" id="attach" hidden>Subtitles for the video of this page<span>Show the Minerr overlay on the largest video of the page.</span></button>
  <div id="controls" hidden>
    <div class="sources" role="group" aria-label="Subtitle source">
      <button data-source="youtube" aria-pressed="true">YouTube captions</button>
      <button data-source="whisperx" aria-pressed="false" disabled>WhisperX</button>
    </div>
    <p id="hint" class="muted" style="margin-top: 8px"></p>
    <button class="generate" id="generate">Generate with WhisperX</button>
    <progress id="progress" max="100" hidden></progress>
    <p id="job" role="status"></p>
  </div>
</section>
<div class="links">
  <button class="player" id="player">Play a local video<span>Mine a video file from this computer.</span></button>
  <button class="player" id="reader">Read a file<span>Read an .epub, .txt, or .srt file.</span></button>
  <button class="player" id="paste">Paste text<span>Read the text that you copy.</span></button>
  <button class="player" id="words">Word browser<span>Find and change the status of words.</span></button>
</div>
<p id="server">Checking the WhisperX server…</p>
<script src="action.js" type="module"></script>
