<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Minerr</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { width: 340px; margin: 0; padding: 14px; background: var(--bg); color: var(--text);
    font: 14px/1.5 var(--font-ui); }
  [hidden] { display: none !important; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 12px; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
  header a { color: var(--accent); font-size: 13px; font-weight: 600; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  /* Three kinds of item, each with its own look: switches in one card, information as plain text, and buttons with an icon and an arrow. */
  section { padding: 14px 2px; border-top: 1px solid var(--line); }
  h2 { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; line-height: 1.3; text-transform: uppercase; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .sources { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; padding: 3px; border-radius: var(--radius-pill); background: var(--raised); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sources button { min-height: 32px; padding: 6px 4px; border: 0; border-radius: var(--radius-pill); background: none; color: var(--muted); font-size: 13px; font-weight: 600; }
  .sources button:hover:not(:disabled) { color: var(--text); }
  .sources button:disabled { cursor: default; opacity: .5; }
  .sources button[aria-pressed="true"] { background: var(--card); color: var(--text); font-weight: 700; opacity: 1; box-shadow: var(--shadow-1); }
  .generate { width: 100%; min-height: 36px; margin-top: 12px; padding: 8px 16px; border: 0; border-radius: var(--radius-pill);
    background: var(--brand); color: var(--on-brand); font-weight: 700; box-shadow: var(--shadow-1); }
  .generate:hover:not(:disabled) { filter: brightness(1.05) saturate(1.1); }
  .generate:disabled { cursor: progress; opacity: .65; }
  progress { display: block; width: 100%; height: 6px; margin-top: 10px; accent-color: var(--accent-fill); }
  #job { margin-top: 8px; font-size: 13px; }
  #job:empty { display: none; }
  .ok { color: var(--ok); font-weight: 600; }
  .error { color: var(--error); font-weight: 600; }
  #server { display: flex; gap: 8px; margin: 12px 2px 0; font-size: 12px; color: var(--muted); }
  #server::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--muted); }
  #server.ok::before { background: var(--ok); }
  #server.error::before { background: var(--error); }
  #server.ok, #server.error { font-weight: 400; color: var(--muted); }
  code { font: 12px/1.4 ui-monospace, monospace; overflow-wrap: anywhere; }
  /* The page text switch is the main action on a web page: a large card that fills with the accent color when it is on. */
  .site { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; padding: 16px 18px; border: 2px solid var(--line);
    border-radius: var(--radius-l); background: var(--card); box-shadow: var(--shadow-1); cursor: pointer; }
  .site:hover { border-color: var(--accent); }
  .site:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .site:has(input:checked) { border-color: var(--accent-fill); background: var(--accent-fill); color: var(--on-accent); box-shadow: var(--shadow-2); }
  .site .text { flex: 1; }
  .site strong { display: block; font-size: 17px; line-height: 1.25; }
  .site small { display: block; margin-top: 2px; font-size: 12px; opacity: .9; }
  .site .state { flex: none; min-width: 3em; font-size: 15px; font-weight: 800; text-align: right; text-transform: uppercase; }
  .site input { appearance: none; position: relative; flex: none; width: 52px; height: 30px; margin: 0; border-radius: 15px;
    background: var(--line); cursor: pointer; outline: none; }
  .site input::before { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .15s; }
  .site input:checked { background: var(--on-accent); }
  .site input:checked::before { background: var(--accent-fill); transform: translateX(22px); }
  .switches { margin-bottom: 10px; border: 1px solid var(--line); border-radius: var(--radius-m); background: var(--card); box-shadow: var(--shadow-1); overflow: hidden; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; cursor: pointer; }
  .toggle + .toggle { border-top: 1px solid var(--line); }
  .toggle strong { display: block; font-size: 14px; line-height: 1.3; }
  mark { padding: 0 2px; border-radius: 2px; background: rgba(250, 204, 21, 0.3); color: inherit; }
  .toggle input { appearance: none; position: relative; flex: none; width: 34px; height: 20px; margin: 0; border-radius: 10px;
    background: var(--line); cursor: pointer; }
  .toggle input::before { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
  .toggle input:checked { background: var(--accent-fill); }
  .toggle input:checked::before { transform: translateX(14px); }
  .toggle input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { width: 100%; margin-top: 4px; padding: 10px 18px; border: 0; border-radius: var(--radius-m);
    background: var(--brand); color: var(--on-brand); font-weight: 700; text-align: left; box-shadow: var(--shadow-1); }
  .primary:hover { filter: brightness(1.05) saturate(1.1); }
  .primary span { display: block; font-size: 12px; font-weight: 400; opacity: .85; }
  .open { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; border-radius: var(--radius-m);
    background: none; text-align: left; }
  .open:hover { background: var(--accent-soft); }
  .open .icon { display: grid; flex: none; place-items: center; width: 36px; height: 36px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent); }
  .open strong { display: block; color: var(--accent); font-size: 14px; line-height: 1.3; }
  .open small { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .open .text { flex: 1; }
  .open::after { content: "›"; color: var(--muted); font-size: 22px; line-height: 1; }
  .open:hover::after { color: var(--accent); }
  .score { display: flex; align-items: baseline; gap: 10px; }
  .score strong { font-size: 28px; line-height: 1.1; }
  .score span { font-weight: 700; }
  .counts { display: flex; flex-wrap: wrap; gap: 2px 12px; margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; vertical-align: 1px; }
  h3 { margin: 12px 0 4px; font-size: 13px; }
  #sentences { max-height: 168px; margin: 0; padding: 0; overflow: auto; list-style: none; }
  #sentences button { width: 100%; padding: 4px 8px; border: 0; border-radius: var(--radius-s); background: none; text-align: left; font-size: 13px; }
  #sentences button:hover { background: var(--raised); }
  .links { display: grid; gap: 2px; margin: 0 -8px; }
</style>
<header>
  <h1>Minerr</h1>
  <a href="options.html" id="options">Options</a>
</header>
<label class="site" id="site-toggle" hidden>
  <span class="text"><strong>Page text on this site</strong><small id="site-name"></small></span>
  <span class="state" id="site-state" aria-hidden="true"></span>
  <input type="checkbox" role="switch" id="site">
</label>
<div class="switches">
<label class="toggle">
  <span><strong>Minerr on</strong><span class="muted">In all tabs. Alt+Shift+M</span></span>
  <input type="checkbox" role="switch" id="enabled">
</label>
<label class="toggle">
  <span><strong>Highlight i+1 sentences</strong><span class="muted">One unknown word: <mark>soft highlight</mark></span></span>
  <input type="checkbox" role="switch" id="iplusone">
</label>
</div>
<section aria-labelledby="score-title" id="score-section">
  <h2 id="score-title">Comprehension</h2>
  <p id="score-empty" class="muted">Reading this tab…</p>
  <div id="score" hidden>
    <p class="score"><strong id="score-percent"></strong><span id="score-label"></span></p>
    <ul id="score-counts" class="counts" aria-label="Different words by status"></ul>
    <p id="score-basis" class="muted"></p>
    <h3 id="sentences-title"></h3>
    <ol id="sentences" aria-labelledby="sentences-title"></ol>
  </div>
</section>
<section aria-labelledby="subs-title">
  <h2 id="subs-title">Subtitles</h2>
  <p id="elsewhere" class="muted" hidden>Subtitles work on YouTube watch pages. Open a video, then open this menu again.</p>
  <button class="primary" id="attach" hidden>Subtitles for the video of this page<span>Show the Minerr overlay on the largest video of the page.</span></button>
  <div id="controls" hidden>
    <div class="sources" role="group" aria-label="Subtitle source">
      <button data-source="youtube" aria-pressed="true">YouTube captions</button>
      <button data-source="whisperx" aria-pressed="false" disabled>WhisperX</button>
    </div>
    <p id="hint" class="muted" style="margin-top: 8px"></p>
    <button class="generate" id="generate">Generate with WhisperX</button>
    <progress id="progress" max="100" hidden></progress>
    <p id="job" role="status"></p>
  </div>
</section>
<section aria-labelledby="open-title">
  <h2 id="open-title">Open</h2>
  <div class="links">
    <button class="open" id="player"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span><span class="text"><strong>Play a local video</strong><small>Mine a video file from this computer.</small></span></button>
    <button class="open" id="reader"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg></span><span class="text"><strong>Read a file</strong><small>Read an .epub, .txt, or .srt file.</small></span></button>
    <button class="open" id="paste"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/></svg></span><span class="text"><strong>Paste text</strong><small>Read the text that you copy.</small></span></button>
    <button class="open" id="words"><span class="icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg></span><span class="text"><strong>Word browser</strong><small>Find and change the status of words.</small></span></button>
  </div>
</section>
<p id="server">Checking the WhisperX server…</p>
<script src="action.js" type="module"></script>
