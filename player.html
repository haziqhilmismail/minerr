<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr video player</title>
<link rel="stylesheet" href="theme.css">
<style>
  main { max-width: 1120px; margin: 0 auto; padding: 20px 20px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; margin: 0 2px 14px; }
  h1 { margin: 0; font-size: 20px; font-weight: 800; line-height: 1.2; }
  header span { color: var(--muted); }

  /* The subtitle sidebar (src/linelist.ts) is at the right of the window, also in full screen, where the video makes room for it. */
  .watch { display: flex; }
  .watch:fullscreen { padding: 12px; background: var(--bg); }
  :root[data-minerr-side]:not([data-minerr-off]) .watch:fullscreen { padding-right: calc(var(--minerr-side-width) + 12px); }
  .stage { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; aspect-ratio: 16 / 9;
    max-height: calc(100vh - 150px); min-height: 240px; overflow: hidden; border-radius: var(--radius-l); background: #000; box-shadow: var(--shadow-2); }
  .watch:fullscreen .stage { max-height: none; aspect-ratio: auto; }
  .stage.empty { border: 2px dashed var(--line); background: var(--card); box-shadow: none; }
  .dragging .stage { outline: 3px solid var(--accent); outline-offset: 3px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .drop { display: grid; justify-items: center; gap: 12px; max-width: 30em; padding: 24px; text-align: center; }
  .drop strong { font-size: 22px; line-height: 1.3; }
  .muted { color: var(--muted); font-size: 13px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 14px; padding: 12px 16px 12px 20px;
    border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--card); box-shadow: var(--shadow-1); }
  .state { flex: 1 1 260px; min-width: 0; }
  #status.error { color: var(--error); font-weight: 600; }
  #status.ok { color: var(--ok); font-weight: 600; }
  progress { display: block; width: 100%; height: 6px; margin-top: 6px; accent-color: var(--accent-fill); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .hint { margin: 10px 2px 0; }
  kbd { padding: 0 5px; border: 1px solid var(--line); border-radius: 6px; font: 600 12px/18px var(--font-ui); }
</style>
<main>
  <header>
    <h1>Minerr</h1>
    <span>Video player</span>
  </header>
  <div class="watch" id="watch">
  <div class="stage empty" id="stage">
    <div class="drop" id="drop">
      <strong>Drop a video file here</strong>
      <button class="primary" id="choose">Choose a video</button>
      <p class="muted">Drop or choose a subtitle file (.srt or .vtt) with the video to use it. Without one, WhisperX can make subtitles on this computer.</p>
    </div>
    <video id="video" controls controlslist="nofullscreen" hidden></video>
  </div>
  </div>
  <div class="bar" id="bar" hidden>
    <div class="state">
      <p id="status" role="status"></p>
      <progress id="progress" max="100" hidden></progress>
    </div>
    <div class="actions">
      <button id="add-subs">Add subtitle file</button>
      <button id="add-second">Add second subtitle file</button>
      <button class="primary" id="generate">Generate with WhisperX</button>
      <button id="save" hidden>Save subtitles</button>
      <button id="fullscreen">Full screen</button>
    </div>
  </div>
  <p class="hint muted" id="hint" hidden>Pause the video, then move the mouse over a word in the subtitles. Press <kbd>A</kbd> to add an Anki card.</p>
  <input type="file" id="video-file" accept="video/*,audio/*,.mkv,.srt,.vtt" multiple hidden>
  <input type="file" id="subs-file" accept=".srt,.vtt" hidden>
  <input type="file" id="second-file" accept=".srt,.vtt" hidden>
</main>
<script src="player.js" type="module"></script>
