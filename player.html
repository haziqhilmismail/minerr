<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr video player</title>
<style>
  :root {
    --bg: #f4f5f8; --card: #ffffff; --raised: #eceef3; --text: #1c1d24; --muted: #5f6270; --line: #dcdee6;
    --accent: #2c4bb8; --on-accent: #ffffff; --ok: #1d7a36; --error: #c22a2a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15161b; --card: #1f2027; --raised: #2b2c35; --text: #ecedf2; --muted: #a3a5b3; --line: #353642;
      --accent: #7c93f2; --on-accent: #10173a; --ok: #74d68f; --error: #ff8f8f;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; }
  [hidden] { display: none !important; }
  main { max-width: 1120px; margin: 0 auto; padding: 20px 20px 40px; }
  header { display: flex; align-items: baseline; gap: 12px; margin: 0 2px 14px; }
  h1 { margin: 0; font-size: 20px; line-height: 1.2; }
  header span { color: var(--muted); }
  p { margin: 0; }
  button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: inherit; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { cursor: progress; opacity: .6; }
  button.primary { border-color: transparent; background: var(--accent); color: var(--on-accent); }
  button.primary:hover:not(:disabled) { border-color: transparent; filter: brightness(1.08); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stage { position: relative; display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9;
    max-height: calc(100vh - 150px); min-height: 240px; overflow: hidden; border-radius: 12px; background: #000; }
  .stage:fullscreen { max-height: none; border-radius: 0; }
  .stage.empty { border: 2px dashed var(--line); background: var(--card); }
  .dragging .stage { outline: 3px solid var(--accent); outline-offset: 3px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .drop { display: grid; justify-items: center; gap: 12px; max-width: 30em; padding: 24px; text-align: center; }
  .drop strong { font-size: 22px; line-height: 1.3; }
  .muted { color: var(--muted); font-size: 13px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; padding: 12px 16px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .state { flex: 1 1 260px; min-width: 0; }
  #status.error { color: var(--error); font-weight: 600; }
  #status.ok { color: var(--ok); font-weight: 600; }
  progress { display: block; width: 100%; height: 6px; margin-top: 6px; accent-color: var(--accent); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .hint { margin: 10px 2px 0; }
  kbd { padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; font: 600 12px/18px system-ui, sans-serif; }
</style>
<main>
  <header>
    <h1>Minerr</h1>
    <span>Video player</span>
  </header>
  <div class="stage empty" id="stage">
    <div class="drop" id="drop">
      <strong>Drop a video file here</strong>
      <button class="primary" id="choose">Choose a video</button>
      <p class="muted">Drop or choose a subtitle file (.srt or .vtt) with the video to use it. Without one, WhisperX can make subtitles on this computer.</p>
    </div>
    <video id="video" controls controlslist="nofullscreen" hidden></video>
  </div>
  <div class="bar" id="bar" hidden>
    <div class="state">
      <p id="status" role="status"></p>
      <progress id="progress" max="100" hidden></progress>
    </div>
    <div class="actions">
      <button id="add-subs">Add subtitle file</button>
      <button class="primary" id="generate">Generate with WhisperX</button>
      <button id="save" hidden>Save subtitles</button>
      <button id="fullscreen">Full screen</button>
    </div>
  </div>
  <p class="hint muted" id="hint" hidden>Pause the video, then move the mouse over a word in the subtitles. Press <kbd>A</kbd> to add an Anki card.</p>
  <input type="file" id="video-file" accept="video/*,audio/*,.mkv,.srt,.vtt" multiple hidden>
  <input type="file" id="subs-file" accept=".srt,.vtt" hidden>
</main>
<script src="player.js" type="module"></script>
