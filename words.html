<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr word browser</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 var(--font-ui); }
  [hidden] { display: none !important; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 72px; }
  header { display: flex; align-items: baseline; gap: 12px; margin: 0 2px 16px; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.2; letter-spacing: -.01em; }
  header span { color: var(--muted); }
  section { margin-top: 16px; padding: 20px 24px; border: 1px solid var(--line); border-radius: var(--radius-l); background: var(--card); box-shadow: var(--shadow-1); }
  h2 { margin: 0 0 10px; font-size: 18px; font-weight: 800; line-height: 1.3; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  input[type="search"], textarea { padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--radius-s);
    background: var(--field); color: inherit; font: inherit; }
  input[type="search"] { flex: 1 1 240px; }
  textarea { display: block; width: 100%; min-height: 120px; resize: vertical; }
  select { padding: 7px 12px; border: 1px solid var(--line); border-radius: var(--radius-s); background: var(--field); color: inherit; font: inherit; }
  button { min-height: 34px; padding: 6px 16px; border: 1px solid var(--line); border-radius: var(--radius-pill); background: var(--card);
    color: inherit; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  button:disabled { cursor: default; opacity: .5; }
  button.primary { border-color: transparent; background: var(--brand); color: var(--on-brand); box-shadow: var(--shadow-1); }
  button.primary:hover:not(:disabled) { border-color: transparent; background: var(--brand); filter: brightness(1.05) saturate(1.1); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; vertical-align: 1px; }
  .bulk { margin-top: 12px; padding: 8px 12px; border-radius: var(--radius-m); background: var(--raised); }
  table { width: 100%; margin-top: 12px; border-collapse: collapse; }
  th, td { padding: 5px 8px; border-top: 1px solid var(--line); text-align: left; }
  thead th { border-top: 0; color: var(--muted); font-size: 13px; font-weight: 600; }
  th.check, td.check { width: 36px; }
  td.word { font: 17px/1.6 var(--font-jp); overflow-wrap: anywhere; }
  td select { padding: 3px 8px; font-size: 14px; }
  .pager { justify-content: space-between; margin-top: 12px; }
  label.choice { display: inline-flex; align-items: center; gap: 6px; }
  #paste-preview { margin-top: 10px; }
  .ok { color: var(--ok); font-weight: 600; }
  .error { color: var(--error); font-weight: 600; }
</style>
<main>
  <header>
    <h1>Minerr</h1>
    <span>Word browser</span>
  </header>
  <section aria-labelledby="list-title">
    <h2 id="list-title">Words</h2>
    <p class="muted">The list shows the words with the status learning, known, or ignored. Words that are not in the list are unknown.</p>
    <div class="row" style="margin-top: 12px">
      <input type="search" id="search" placeholder="Search" aria-label="Search the words">
      <label class="choice">Status
        <select id="filter">
          <option value="all">All</option>
          <option value="learning">Learning</option>
          <option value="known">Known</option>
          <option value="ignored">Ignored</option>
        </select>
      </label>
      <label class="choice">Sort by
        <select id="sort">
          <option value="word">Word</option>
          <option value="status">Status</option>
        </select>
      </label>
    </div>
    <div class="bulk row">
      <span id="selection" role="status">0 selected</span>
      <span class="row" id="bulk" role="group" aria-label="Set the status of the selected words"></span>
    </div>
    <table>
      <thead><tr><th class="check" scope="col"><input type="checkbox" id="select-all" aria-label="Select all the words that match"></th><th scope="col">Word</th><th scope="col">Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="row pager">
      <button id="previous">Previous</button>
      <span id="range" class="muted"></span>
      <button id="next">Next</button>
    </div>
  </section>
  <section aria-labelledby="paste-title">
    <h2 id="paste-title">Add words</h2>
    <p class="muted">Paste a list of words, or a Japanese text. Minerr gives each word the status that you select.</p>
    <textarea id="paste-text" aria-label="Words or text" style="margin-top: 12px"></textarea>
    <div class="row" style="margin-top: 10px">
      <label class="choice"><input type="radio" name="pasteKind" value="lines" checked>One word on each line</label>
      <label class="choice"><input type="radio" name="pasteKind" value="text">Japanese text</label>
      <label class="choice">Status
        <select id="paste-status">
          <option value="known">Known</option>
          <option value="learning">Learning</option>
          <option value="ignored">Ignored</option>
        </select>
      </label>
      <button id="paste-preview-button">Preview</button>
      <button class="primary" id="paste-save" disabled>Save</button>
    </div>
    <p id="paste-preview" role="status"></p>
  </section>
</main>
<script src="words.js" type="module"></script>
