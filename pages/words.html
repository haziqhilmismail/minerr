<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr word browser</title>
<link rel="stylesheet" href="../theme.css">
<style>
  header { display: flex; align-items: baseline; gap: var(--space-3); margin: 0 var(--space-1) var(--space-2); }
  h1 { font-size: var(--text-title1); }
  header span { color: var(--muted); }
  section { margin-top: var(--space-5); padding: var(--space-4); border-radius: var(--radius-m); corner-shape: var(--corner); background: var(--card); }
  h2 { margin: 0 0 var(--space-1); font-size: var(--text-headline); font-weight: 600; line-height: 1.3; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); }
  input[type="search"] { flex: 1 1 240px; }
  textarea { display: block; width: 100%; min-height: 120px; resize: vertical; }
  .bulk { margin-top: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-s); corner-shape: var(--corner); background: var(--raised); }
  .bulk button { min-height: 32px; padding: 0 var(--space-3); background: var(--card); font-size: var(--text-footnote); }
  table { width: 100%; margin-top: var(--space-3); border-collapse: collapse; }
  th, td { padding: var(--space-1) var(--space-2); border-top: 1px solid var(--separator); text-align: left; }
  thead th { border-top: 0; color: var(--muted); font-size: var(--text-footnote); font-weight: 600; }
  th.check, td.check { width: 36px; }
  tbody tr { transition: background-color var(--fast) var(--ease); }
  tbody tr:hover { background: var(--raised); }
  td.word { font: var(--text-headline)/1.6 var(--font-jp); overflow-wrap: anywhere; }
  td select { min-height: 32px; padding: 0 var(--space-2); font-size: var(--text-footnote); }
  .pager { justify-content: space-between; margin-top: var(--space-3); }
  label.choice { display: inline-flex; align-items: center; gap: var(--space-2); }
  #paste-preview { margin-top: var(--space-3); }
</style>
<main class="column">
  <header>
    <h1>Minerr</h1>
    <span>Word browser</span>
  </header>
  <section aria-labelledby="list-title">
    <h2 id="list-title">Words</h2>
    <p class="muted">The list shows the words with the status learning, known, or ignored. Words that are not in the list are unknown.</p>
    <div class="row" style="margin-top: 12px">
      <input type="search" id="search" placeholder="Search" aria-label="Search the words">
      <label class="choice">Status
        <select id="filter">
          <option value="all">All</option>
          <option value="learning">Learning</option>
          <option value="known">Known</option>
          <option value="ignored">Ignored</option>
        </select>
      </label>
      <label class="choice">Sort by
        <select id="sort">
          <option value="word">Word</option>
          <option value="status">Status</option>
        </select>
      </label>
    </div>
    <div class="bulk row">
      <span id="selection" role="status">0 selected</span>
      <span class="row" id="bulk" role="group" aria-label="Set the status of the selected words"></span>
    </div>
    <table>
      <thead><tr><th class="check" scope="col"><input type="checkbox" id="select-all" aria-label="Select all the words that match"></th><th scope="col">Word</th><th scope="col">Status</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="row pager">
      <button id="previous">Previous</button>
      <span id="range" class="muted"></span>
      <button id="next">Next</button>
    </div>
  </section>
  <section aria-labelledby="paste-title">
    <h2 id="paste-title">Add words</h2>
    <p class="muted">Paste a list of words, or a Japanese text. Minerr gives each word the status that you select.</p>
    <textarea id="paste-text" aria-label="Words or text" style="margin-top: 12px"></textarea>
    <div class="row" style="margin-top: 10px">
      <div class="segmented" role="radiogroup" aria-label="What you paste">
        <label><input type="radio" name="pasteKind" value="lines" checked>One word on each line</label>
        <label><input type="radio" name="pasteKind" value="text">Japanese text</label>
      </div>
      <label class="choice">Status
        <select id="paste-status">
          <option value="known">Known</option>
          <option value="learning">Learning</option>
          <option value="ignored">Ignored</option>
        </select>
      </label>
      <button id="paste-preview-button">Preview</button>
      <button class="primary" id="paste-save" disabled>Save</button>
    </div>
    <p id="paste-preview" role="status"></p>
  </section>
</main>
<script src="words.js" type="module"></script>
