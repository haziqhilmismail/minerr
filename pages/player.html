<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr video player</title>
<link rel="stylesheet" href="../theme.css">
<style>
  main { max-width: 1120px; margin: 0 auto; padding: var(--space-5) var(--space-5) var(--space-6); }
  header { display: flex; align-items: baseline; gap: var(--space-3); margin: 0 var(--space-1) var(--space-4); }
  header span { color: var(--muted); }

  /* The subtitle sidebar (src/video/sidebar/sidebar.ts) is at the right of the window, also in full screen, where the video makes room for it. */
  .watch { display: flex; }
  .watch:fullscreen { padding: var(--space-3); background: var(--bg); }
  :root[data-minerr-side]:not([data-minerr-off]) .watch:fullscreen { padding-right: calc(var(--minerr-side-width) + var(--space-3)); }
  .stage { position: relative; display: grid; place-items: center; flex: 1; min-width: 0; aspect-ratio: 16 / 9;
    max-height: calc(100vh - 150px); min-height: 240px; overflow: hidden; border-radius: var(--radius-l); corner-shape: var(--corner);
    background: #000; box-shadow: var(--shadow-2); }
  .watch:fullscreen .stage { max-height: none; aspect-ratio: auto; }
  .stage.empty { border: 1.5px dashed var(--line); background: var(--card); box-shadow: none; }
  .dragging .stage { outline: 3px solid var(--accent); outline-offset: 3px; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .drop { display: grid; justify-items: center; gap: var(--space-3); max-width: 30em; padding: var(--space-5); text-align: center; }
  .drop strong { font: 600 var(--text-title2)/1.3 var(--font-display); }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-4); margin-top: var(--space-4); padding: var(--space-3) var(--space-3) var(--space-3) var(--space-5);
    border-radius: var(--radius-l); corner-shape: var(--corner); background: var(--card); }
  .state { flex: 1 1 260px; min-width: 0; }
  progress { margin-top: 6px; }
  .actions { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .hint { margin: var(--space-3) var(--space-1) 0; }
</style>
<main>
  <header>
    <h1>Minerr</h1>
    <span>Video player</span>
  </header>
  <div class="watch" id="watch">
  <div class="stage empty" id="stage">
    <div class="drop" id="drop">
      <strong>Drop a video file here</strong>
      <button class="primary" id="choose">Choose a video</button>
      <p class="muted">Drop or choose a subtitle file (.srt or .vtt) with the video to use it. Without one, WhisperX can make subtitles on this computer.</p>
    </div>
    <video id="video" controls controlslist="nofullscreen" hidden></video>
  </div>
  </div>
  <div class="bar" id="bar" hidden>
    <div class="state">
      <p id="status" role="status"></p>
      <progress id="progress" max="100" hidden></progress>
    </div>
    <div class="actions">
      <button id="add-subs">Add subtitle file</button>
      <button id="add-second">Add second subtitle file</button>
      <button class="primary" id="generate">Generate with WhisperX</button>
      <button id="save" hidden>Save subtitles</button>
      <button id="fullscreen">Full screen</button>
    </div>
  </div>
  <p class="hint muted" id="hint" hidden>Pause the video, then move the mouse over a word in the subtitles. Press <kbd>A</kbd> to add an Anki card.</p>
  <input type="file" id="video-file" accept="video/*,audio/*,.mkv,.srt,.vtt" multiple hidden>
  <input type="file" id="subs-file" accept=".srt,.vtt" hidden>
  <input type="file" id="second-file" accept=".srt,.vtt" hidden>
</main>
<script src="player.js" type="module"></script>
