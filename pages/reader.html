<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr reader</title>
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  header { position: relative; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-2) var(--space-4);
    border-bottom: 1px solid var(--separator); background: var(--card); }
  h1 { font-size: var(--text-headline); }
  #title::before { content: attr(data-title); }
  #title { flex: 1 1 200px; min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
  button, select { min-height: 32px; font-size: var(--text-footnote); }
  button { padding: 0 var(--space-3); }
  button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  select { max-width: 260px; }
  label.choice { display: inline-flex; align-items: center; gap: var(--space-2); font-size: var(--text-footnote); }

  .start { display: grid; flex: 1; place-content: center; justify-items: center; gap: var(--space-3); padding: var(--space-5); text-align: center; }
  .drop { display: grid; justify-items: center; gap: var(--space-3); max-width: 34em; padding: var(--space-6) var(--space-5); border: 1.5px dashed var(--line);
    border-radius: var(--radius-l); corner-shape: var(--corner); background: var(--card); transition: border-color var(--fast) var(--ease), background-color var(--fast) var(--ease); }
  .dragging .drop { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { font: 600 var(--text-title2)/1.3 var(--font-display); }
  .start .primary { min-height: 40px; font-size: var(--text-body); }

  .text { flex: 1; min-height: 0; overflow: auto; padding: var(--space-6) var(--space-5); outline: none;
    font: 22px/1.9 "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Hiragino Sans", "Noto Sans JP", serif; }
  .text article { max-inline-size: 38em; margin-inline: auto; }
  .text.vertical { writing-mode: vertical-rl; overflow-x: auto; overflow-y: hidden; padding: var(--space-5) var(--space-6); }
  .text.vertical article { max-inline-size: none; }
  .text p { margin-block: 0 0.6em; white-space: pre-line; }
  .text h1, .text h2, .text h3, .text h4 { font-size: 1.2em; line-height: 1.5; }
  .text rt::before { content: attr(data-rt); }
  .text .entry { padding-block-end: 0.8em; margin-block-end: 0.8em; border-block-end: 1px solid var(--separator); }
  #status { padding: var(--space-1) var(--space-4); border-top: 1px solid var(--separator); background: var(--card); color: var(--muted); font-size: var(--text-footnote); }
  #status:empty { display: none; }
</style>
<header>
  <h1>Minerr</h1>
  <span id="title" data-title="Reader"></span>
  <label class="choice" id="chapter-choice" hidden>Chapter <select id="chapters" aria-label="Chapter"></select></label>
  <label class="choice" id="auto-choice" hidden title="Text that you copy goes into this page when the page gets the focus"><input type="checkbox" role="switch" id="auto-paste">Auto-paste</label>
  <button id="clear" hidden>Clear</button>
  <button id="vertical" aria-pressed="false">Vertical text</button>
  <button id="open">Open file</button>
  <button id="paste-mode">Paste text</button>
</header>
<main class="start" id="start">
  <div class="drop">
    <strong>Drop a file here</strong>
    <button class="primary" id="choose">Choose a file</button>
    <p class="muted">Minerr reads .epub, .txt, .srt, and .vtt files. It keeps the place where you stop in each file.</p>
  </div>
</main>
<div class="text" id="text" tabindex="-1" hidden><article id="article" lang="ja"></article></div>
<p id="status" role="status"></p>
<input type="file" id="file" accept=".epub,.txt,.srt,.vtt,application/epub+zip,text/plain" hidden>
<script src="reader.js" type="module"></script>
