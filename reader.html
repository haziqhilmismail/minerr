<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minerr reader</title>
<link rel="stylesheet" href="theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 "Hiragino Sans", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif; }
  [hidden] { display: none !important; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  h1 { margin: 0; font-size: 18px; line-height: 1.2; }
  #title::before { content: attr(data-title); }
  #title { flex: 1 1 200px; min-width: 0; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
  button, select { padding: 5px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    color: inherit; font: inherit; font-size: 14px; cursor: pointer; }
  button { font-weight: 600; }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  button.primary { border-color: transparent; background: var(--accent); color: var(--on-accent); }
  select { max-width: 260px; background: var(--field); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.choice { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
  p { margin: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: var(--error); font-weight: 600; }

  .start { display: grid; flex: 1; place-content: center; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
  .drop { display: grid; justify-items: center; gap: 12px; max-width: 34em; padding: 32px 28px; border: 2px dashed var(--line); border-radius: 12px; background: var(--card); }
  .dragging .drop { border-color: var(--accent); }
  .drop strong { font-size: 20px; line-height: 1.3; }
  kbd { padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; font: 600 12px/18px system-ui, sans-serif; }

  .text { flex: 1; min-height: 0; overflow: auto; padding: 32px 24px; outline: none;
    font: 22px/1.9 "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "Hiragino Sans", "Noto Sans JP", serif; }
  .text article { max-inline-size: 38em; margin-inline: auto; }
  .text.vertical { writing-mode: vertical-rl; overflow-x: auto; overflow-y: hidden; padding: 24px 32px; }
  .text.vertical article { max-inline-size: none; }
  .text p { margin-block: 0 0.6em; white-space: pre-line; }
  .text h1, .text h2, .text h3, .text h4 { font-size: 1.2em; line-height: 1.5; }
  .text rt::before { content: attr(data-rt); }
  .text .entry { padding-block-end: 0.8em; margin-block-end: 0.8em; border-block-end: 1px solid var(--line); }
  #status { padding: 4px 16px; border-top: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; }
  #status:empty { display: none; }
</style>
<header>
  <h1>Minerr</h1>
  <span id="title" data-title="Reader"></span>
  <label class="choice" id="chapter-choice" hidden>Chapter <select id="chapters" aria-label="Chapter"></select></label>
  <label class="choice" id="auto-choice" hidden title="Text that you copy goes into this page when the page gets the focus"><input type="checkbox" id="auto-paste">Auto-paste</label>
  <button id="clear" hidden>Clear</button>
  <button id="vertical" aria-pressed="false">Vertical text</button>
  <button id="open">Open file</button>
  <button id="paste-mode">Paste text</button>
</header>
<main class="start" id="start">
  <div class="drop">
    <strong>Drop a file here</strong>
    <button class="primary" id="choose">Choose a file</button>
    <p class="muted">Minerr reads .epub, .txt, .srt, and .vtt files. It keeps the place where you stop in each file.</p>
  </div>
</main>
<div class="text" id="text" tabindex="-1" hidden><article id="article" lang="ja"></article></div>
<p id="status" role="status"></p>
<input type="file" id="file" accept=".epub,.txt,.srt,.vtt,application/epub+zip,text/plain" hidden>
<script src="reader.js" type="module"></script>
